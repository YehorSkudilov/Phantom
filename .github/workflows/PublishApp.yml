name: Publish App

permissions:
  contents: write

env:
  # The build jobs check Phantom out into its own folder next to AppSkeleton (referenced as ..\..\..\AppSkeleton).
  PROJECT_PATH: Phantom/src/Phantom.Client/Phantom.csproj
  VERSION_BUMP_PROJECT_PATH: src/Phantom.Client/Phantom.csproj
  PACKAGE_NAME: com.yehorskudilov.phantom

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump"
        required: true
        default: x.x.1
        type: choice
        options:
          - none
          - x.x.1
          - x.1.0
          - 1.0.0

      release_channel:
        description: "Google Play release channel"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

      publish_android:
        description: "Android (Google Play)"
        type: boolean
        default: true

      publish_windows:
        description: "Windows (Microsoft Store)"
        type: boolean
        default: false

      publish_ios:
        description: "iOS (TestFlight)"
        type: boolean
        default: true

      publish_macos:
        description: "macOS (Mac App Store / TestFlight)"
        type: boolean
        default: false


  # Lets Publish.yml call this as a reusable workflow instead of keeping its own copy
  # of the version-bump/build/release jobs - see that file's publish-app job. Inputs
  # are re-declared as plain strings since workflow_call doesn't support the `choice`
  # type; Publish.yml's own workflow_dispatch still exposes the dropdown to the human
  # and passes the chosen string straight through.
  workflow_call:
    inputs:
      version_bump:
        description: "Version bump"
        required: true
        type: string
        default: x.x.1

      release_channel:
        description: "Google Play release channel"
        required: true
        type: string
        default: internal

      publish_android:
        description: "Android (Google Play)"
        type: boolean
        default: true

      publish_windows:
        description: "Windows (Microsoft Store)"
        type: boolean
        default: false

      publish_ios:
        description: "iOS (TestFlight)"
        type: boolean
        default: true

      publish_macos:
        description: "macOS (Mac App Store / TestFlight)"
        type: boolean
        default: true


jobs:

  # ==================================================
  # VERSION BUMP
  # ==================================================

  version:
    runs-on: ubuntu-latest

    outputs:
      new_version: ${{ steps.bump.outputs.version }}
      version_code: ${{ steps.bump.outputs.version_code }}
      bumped: ${{ steps.bump.outputs.bumped }}
      xcode_version: ${{ steps.set_xcode.outputs.xcode_version }}

    steps:
      - name: Check a platform is selected
        if: ${{ !inputs.publish_android && !inputs.publish_windows && !inputs.publish_ios && !inputs.publish_macos }}
        run: |
          echo "Select at least one platform to publish"
          exit 1

      # The Xcode the iOS build uses: the IOS_XCODE_VERSION variable when set (it must be one installed on the macOS
      # runner, e.g. 26.6), otherwise the newest stable one there.
      - name: Set Xcode version
        id: set_xcode
        run: |
          XCODE_VERSION="${{ vars.IOS_XCODE_VERSION }}"
          XCODE_VERSION="${XCODE_VERSION:-latest-stable}"
          echo "Xcode version: $XCODE_VERSION"
          echo "xcode_version=$XCODE_VERSION" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v6

      - name: Bump MAUI version
        id: bump
        run: |
          FILE="${{ env.VERSION_BUMP_PROJECT_PATH }}"

          CURRENT=$(grep -oPm1 "(?<=<ApplicationDisplayVersion>)[^<]+" "$FILE")

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=${PATCH:-0}

          MODE="${{ inputs.version_bump }}"
          BUMPED=false

          case "$MODE" in
            x.x.1)
              PATCH=$((PATCH + 1))
              BUMPED=true
              ;;
            x.1.0)
              MINOR=$((MINOR + 1))
              PATCH=0
              BUMPED=true
              ;;
            1.0.0)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              BUMPED=true
              ;;
            none)
              ;;
            *)
              echo "Invalid version"
              exit 1
              ;;
          esac

          NEW="$MAJOR.$MINOR.$PATCH"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))

          if [ "$BUMPED" = true ]; then
            sed -i "s|<ApplicationDisplayVersion>.*</ApplicationDisplayVersion>|<ApplicationDisplayVersion>$NEW</ApplicationDisplayVersion>|" "$FILE"
            sed -i "s|<ApplicationVersion>.*</ApplicationVersion>|<ApplicationVersion>$VERSION_CODE</ApplicationVersion>|" "$FILE"
          fi

          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "bumped=$BUMPED" >> $GITHUB_OUTPUT

      - name: Commit version bump
        if: steps.bump.outputs.bumped == 'true'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ${{ env.VERSION_BUMP_PROJECT_PATH }}
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git push

  # ==================================================
  # BUILD ANDROID
  # ==================================================

  build-android:
    needs: version
    if: ${{ inputs.publish_android }}
    runs-on: windows-latest

    steps:
      # The version job pushed a bump commit, so check out the branch tip rather than the triggering SHA.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          path: Phantom

      - name: Checkout AppSkeleton
        uses: actions/checkout@v6
        with:
          repository: YehorSkudilov/AppSkeleton
          token: ${{ secrets.REPO_TOKEN }}
          path: AppSkeleton

      # =========================
      # .NET + MAUI
      # =========================

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The runner's Visual Studio usually has MAUI already. Any `dotnet workload install` also reinstalls every
      # workload Visual Studio registered (iOS, Mac Catalyst, wasm...), several minutes, so only install when it's
      # really missing. Visual Studio registers MAUI for Android as "android" next to a "maui-*" workload (which
      # brings the shared MAUI SDK), never as "maui-android", so either counts.
      - name: Install MAUI Android workload
        shell: pwsh
        run: |
          $workloads = dotnet workload list | Out-String
          Write-Host $workloads
          $hasMauiAndroid = $workloads -match '(?m)^\s*maui-android\s'
          $hasAndroidAndMaui = ($workloads -match '(?m)^\s*android\s') -and ($workloads -match '(?m)^\s*maui(-\w+)?\s')
          if ($hasMauiAndroid -or $hasAndroidAndMaui) {
            Write-Host "MAUI for Android already installed"
          } else {
            dotnet workload install maui-android --skip-manifest-update
          }

      # =========================
      # KEYSTORE
      # =========================

      # The keystore is kept out of the repo: store it base64-encoded in the ANDROID_KEYSTORE_BASE64 secret.
      - name: Restore keystore
        id: keystore
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")) {
            throw "ANDROID_KEYSTORE_BASE64 secret is not set"
          }

          $keystore = Join-Path $env:RUNNER_TEMP "phantom.keystore"
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}"))

          echo "path=$keystore" >> $env:GITHUB_OUTPUT

      # =========================
      # BUILD + SIGNING
      # =========================

      - name: Publish Android AAB + APK
        shell: pwsh
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}" `
            -c Release `
            -f net10.0-android `
            /p:AndroidPackageFormat=aab `
            /p:AndroidBuildApk=true `
            /p:AndroidKeyStore=true `
            "/p:AndroidSigningKeyStore=${{ steps.keystore.outputs.path }}" `
            "/p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEYALIAS_NAME }}" `
            "/p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEYALIAS_PASS }}" `
            "/p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASS }}" `
            "/p:ApiBaseUrl=${{ vars.API_BASE_URL }}"

      # =========================
      # FIND AAB
      # =========================

      - name: Find AAB
        id: find_aab
        shell: pwsh
        run: |
          $file = Get-ChildItem -Recurse -Filter "*-Signed.aab" |
            Where-Object { $_.FullName -like "*Release*" } |
            Select-Object -First 1

          if ($null -eq $file) {
            $file = Get-ChildItem -Recurse -Filter *.aab |
              Select-Object -First 1
          }

          if ($null -eq $file) {
            Write-Host "No AAB found"
            Get-ChildItem -Recurse -Filter *.aab
            throw "AAB not found"
          }

          $posix = $file.FullName -replace "\\", "/"

          Write-Host "AAB: $posix"
          echo "file=$posix" >> $env:GITHUB_OUTPUT

      # =========================
      # FIND APK
      # =========================

      - name: Find APK
        id: find_apk
        shell: pwsh
        run: |
          $file = Get-ChildItem -Recurse -Filter "*-Signed.apk" |
            Where-Object { $_.FullName -like "*Release*" } |
            Select-Object -First 1

          if ($null -eq $file) {
            $file = Get-ChildItem -Recurse -Filter *.apk |
              Select-Object -First 1
          }

          if ($null -eq $file) {
            Write-Host "No APK found"
            Get-ChildItem -Recurse -Filter *.apk
            throw "APK not found"
          }

          $posix = $file.FullName -replace "\\", "/"

          Write-Host "APK: $posix"
          echo "file=$posix" >> $env:GITHUB_OUTPUT

      # =========================
      # UPLOAD ARTIFACTS
      # =========================

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: ${{ steps.find_aab.outputs.file }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.find_apk.outputs.file }}

      # =============================
      # GOOGLE PLAY UPLOAD
      # =============================

      - name: Upload AAB to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ steps.find_aab.outputs.file }}
          track: ${{ inputs.release_channel }}
          status: completed

  # ==================================================
  # BUILD WINDOWS
  # ==================================================

  build-windows:
    needs: version
    if: ${{ inputs.publish_windows }}
    runs-on: windows-latest

    steps:
      # The version job pushed a bump commit, so check out the branch tip rather than the triggering SHA.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          path: Phantom

      - name: Checkout AppSkeleton
        uses: actions/checkout@v6
        with:
          repository: YehorSkudilov/AppSkeleton
          token: ${{ secrets.REPO_TOKEN }}
          path: AppSkeleton

      # =========================
      # .NET + MAUI
      # =========================

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The runner's Visual Studio usually has MAUI already. Any `dotnet workload install` also reinstalls every
      # workload Visual Studio registered (iOS, Mac Catalyst, Android...), so only install when it's really missing.
      - name: Install MAUI Windows workload
        shell: pwsh
        run: |
          dotnet workload list
          if (dotnet workload list | Select-String -Pattern '^\s*maui-windows\s' -Quiet) {
            Write-Host "maui-windows already installed"
          } else {
            dotnet workload install maui-windows --skip-manifest-update
          }

      # =========================
      # PACKAGE IDENTITY
      # =========================

      # The Store only accepts a package whose identity matches the one reserved in Partner Center
      # (Product identity page): set it in the MSSTORE_PACKAGE_NAME, MSSTORE_PUBLISHER and
      # MSSTORE_PUBLISHER_DISPLAY_NAME variables. The Store needs the fourth version part to be 0.
      - name: Set package identity
        shell: pwsh
        env:
          MSSTORE_PACKAGE_NAME: ${{ vars.MSSTORE_PACKAGE_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          foreach ($name in "MSSTORE_PACKAGE_NAME", "MSSTORE_PUBLISHER", "MSSTORE_PUBLISHER_DISPLAY_NAME") {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "$name variable is not set"
            }
          }

          $file = Resolve-Path "Phantom/src/Phantom.Client/Platforms/Windows/Package.appxmanifest"
          [xml]$xml = Get-Content $file -Raw

          $xml.Package.Identity.Name = $env:MSSTORE_PACKAGE_NAME
          $xml.Package.Identity.Publisher = $env:MSSTORE_PUBLISHER
          $xml.Package.Identity.Version = "${{ needs.version.outputs.new_version }}.0"
          $xml.Package.Properties.PublisherDisplayName = $env:MSSTORE_PUBLISHER_DISPLAY_NAME

          $xml.Save($file.Path)

      # =========================
      # BUILD MSIX
      # =========================

      # Local builds stay unpackaged (WindowsPackageType=None in the csproj); CI packages it as MSIX.
      # Left unsigned - the Store signs it on ingestion.
      - name: Publish Windows MSIX
        shell: pwsh
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}" `
            -c Release `
            -f net10.0-windows10.0.19041.0 `
            /p:RuntimeIdentifierOverride=win-x64 `
            /p:WindowsPackageType=MSIX `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=false `
            "/p:ApiBaseUrl=${{ vars.API_BASE_URL }}"

      # =========================
      # FIND MSIX
      # =========================

      - name: Find MSIX
        id: find_msix
        shell: pwsh
        run: |
          # AppPackages also holds the Windows App SDK runtime packages under Dependencies - skip those.
          $file = Get-ChildItem -Recurse -Filter *.msix |
            Where-Object { $_.FullName -like "*AppPackages*" -and $_.FullName -notlike "*\Dependencies\*" } |
            Select-Object -First 1

          if ($null -eq $file) {
            Write-Host "No MSIX found"
            Get-ChildItem -Recurse -Filter *.msix
            throw "MSIX not found"
          }

          $posix = $file.FullName -replace "\\", "/"

          Write-Host "MSIX: $posix"
          echo "file=$posix" >> $env:GITHUB_OUTPUT

      # =========================
      # UPLOAD ARTIFACT
      # =========================

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: ${{ steps.find_msix.outputs.file }}

      # =============================
      # MICROSOFT STORE UPLOAD
      # =============================

      # Needs a Microsoft Entra app added to Partner Center (Account settings > User management >
      # Microsoft Entra applications, Manager role): AZURE_AD_TENANT_ID, AZURE_AD_CLIENT_ID,
      # AZURE_AD_CLIENT_SECRET and MSSTORE_SELLER_ID secrets, plus the app's Store ID (9N...)
      # in the MSSTORE_PRODUCT_ID variable. Creates and commits a new submission.
      - name: Setup Microsoft Store CLI
        uses: microsoft/setup-msstore-cli@v1

      - name: Upload MSIX to Microsoft Store
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId "${{ secrets.AZURE_AD_TENANT_ID }}" `
            --sellerId "${{ secrets.MSSTORE_SELLER_ID }}" `
            --clientId "${{ secrets.AZURE_AD_CLIENT_ID }}" `
            --clientSecret "${{ secrets.AZURE_AD_CLIENT_SECRET }}"
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed" }

          msstore publish "${{ steps.find_msix.outputs.file }}" -id "${{ vars.MSSTORE_PRODUCT_ID }}"
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed" }

  # ==================================================
  # BUILD IOS
  # ==================================================

  build-ios:
    needs: version
    if: ${{ inputs.publish_ios }}
    # The Xcode 27 image (public preview, Apple silicon), which the current MAUI iOS workload needs. Once Xcode 27 is on
    # the regular images, macos-latest works again.
    runs-on: xcode-27

    steps:
      # The version job pushed a bump commit, so check out the branch tip rather than the triggering SHA.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          path: Phantom

      - name: Checkout AppSkeleton
        uses: actions/checkout@v6
        with:
          repository: YehorSkudilov/AppSkeleton
          token: ${{ secrets.REPO_TOKEN }}
          path: AppSkeleton

      # =========================
      # XCODE + .NET + MAUI
      # =========================

      # The MAUI iOS workload only builds with the Xcode version it was made for. The version job picks it (see its
      # Set Xcode version step); pin it with the IOS_XCODE_VERSION variable if the build complains.
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ needs.version.outputs.xcode_version }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # All of MAUI, not just iOS: restore evaluates every target framework in the csproj (android, ios, maccatalyst),
      # even when publishing only net10.0-ios, and fails if any of their workloads is missing.
      # Skip the install (several minutes) when the runner image already has everything restore needs.
      - name: Install MAUI workloads
        run: |
          workloads=$(dotnet workload list)
          echo "$workloads"
          has() { echo "$workloads" | grep -qE "^\s*$1\s"; }
          if has 'maui(-\w+)?' && has android && has ios && has maccatalyst; then
            echo "MAUI workloads already installed"
          else
            dotnet workload install maui
          fi

      # =========================
      # SIGNING
      # =========================

      # The Apple Distribution certificate (.p12, made with OpenSSL - no Mac needed) goes into a throwaway keychain,
      # and the App Store provisioning profile where Xcode and the .NET build look for it. The signing identity and
      # profile name are read from the files themselves, so nothing else has to be kept in sync with them.
      - name: Install certificate and provisioning profile
        id: signing
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          for name in IOS_P12_BASE64 IOS_P12_PASSWORD IOS_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "$name secret is not set"
              exit 1
            fi
          done

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Apple's intermediate certificate, so the distribution certificate counts as valid.
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN" -T /usr/bin/codesign

          echo "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_P12_PASSWORD" -f pkcs12 -A -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/distribution.p12"

          # Lets codesign use the key without a password prompt, and puts the keychain in the search list.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -oE '"(Apple|iPhone) Distribution[^"]*"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "No distribution signing identity found in the .p12"
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi

          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")

          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE" "$dir/$PROFILE_UUID.mobileprovision"
          done

          echo "Signing identity: $IDENTITY"
          echo "Provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"

      # =========================
      # BUILD IPA
      # =========================

      - name: Publish iOS IPA
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}" \
            -c Release \
            -f net10.0-ios \
            -r ios-arm64 \
            "-p:CodesignKey=${{ steps.signing.outputs.identity }}" \
            "-p:CodesignProvision=${{ steps.signing.outputs.profile }}" \
            "-p:ApiBaseUrl=${{ vars.API_BASE_URL }}"

      # =========================
      # FIND IPA
      # =========================

      - name: Find IPA
        id: find_ipa
        run: |
          FILE=$(find . -name "*.ipa" -path "*Release*" | head -1)

          if [ -z "$FILE" ]; then
            echo "No IPA found"
            find . -name "*.ipa"
            exit 1
          fi

          echo "IPA: $FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      # =========================
      # UPLOAD ARTIFACT
      # =========================

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ steps.find_ipa.outputs.file }}

      # =============================
      # TESTFLIGHT UPLOAD
      # =============================

      # Needs an App Store Connect API key (Users and Access > Integrations > App Store Connect API, App Manager
      # role): APPSTORE_KEY_ID, APPSTORE_ISSUER_ID and APPSTORE_PRIVATE_KEY (the .p8 file's contents) secrets.
      # The build shows up in TestFlight once Apple has processed it; submitting it for App Store review stays manual.
      - name: Upload IPA to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          for name in APPSTORE_KEY_ID APPSTORE_ISSUER_ID APPSTORE_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "$name secret is not set"
              exit 1
            fi
          done

          # altool looks for the key as ~/private_keys/AuthKey_<key id>.p8.
          mkdir -p "$HOME/private_keys"
          echo "$APPSTORE_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_$APPSTORE_KEY_ID.p8"

          xcrun altool --upload-app \
            --type ios \
            --file "${{ steps.find_ipa.outputs.file }}" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${{ steps.signing.outputs.keychain }}" ]; then
            security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
          fi
          rm -rf "$HOME/private_keys"

  # ==================================================
  # BUILD MACOS (MAC CATALYST)
  # ==================================================

  build-macos:
    needs: version
    if: ${{ inputs.publish_macos }}
    # Same Xcode as the iOS build: the Mac Catalyst workload ships with the iOS one.
    runs-on: xcode-27

    steps:
      # The version job pushed a bump commit, so check out the branch tip rather than the triggering SHA.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          path: Phantom

      - name: Checkout AppSkeleton
        uses: actions/checkout@v6
        with:
          repository: YehorSkudilov/AppSkeleton
          token: ${{ secrets.REPO_TOKEN }}
          path: AppSkeleton

      # =========================
      # XCODE + .NET + MAUI
      # =========================

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ needs.version.outputs.xcode_version }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # All of MAUI: restore evaluates every target framework in the csproj, even when publishing only Mac Catalyst.
      # Skip the install (several minutes) when the runner image already has everything restore needs.
      - name: Install MAUI workloads
        run: |
          workloads=$(dotnet workload list)
          echo "$workloads"
          has() { echo "$workloads" | grep -qE "^\s*$1\s"; }
          if has 'maui(-\w+)?' && has android && has ios && has maccatalyst; then
            echo "MAUI workloads already installed"
          else
            dotnet workload install maui
          fi

      # =========================
      # SIGNING
      # =========================

      # The Mac App Store takes a signed installer package: the app is signed with the same Apple Distribution
      # certificate as the iOS build (IOS_P12_*), and the .pkg around it with a Mac Installer Distribution certificate
      # (MACOS_INSTALLER_P12_*). The Mac Catalyst App Store provisioning profile is MACOS_PROFILE_BASE64. Identities and
      # the profile name are read from the files themselves.
      - name: Install certificates and provisioning profile
        id: signing
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          MACOS_INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
          MACOS_PROFILE_BASE64: ${{ secrets.MACOS_PROFILE_BASE64 }}
        run: |
          for name in IOS_P12_BASE64 IOS_P12_PASSWORD MACOS_INSTALLER_P12_BASE64 MACOS_INSTALLER_P12_PASSWORD MACOS_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "$name secret is not set"
              exit 1
            fi
          done

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Apple's intermediate certificate, so the distribution certificates count as valid.
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/productbuild

          echo "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_P12_PASSWORD" -f pkcs12 -A -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/distribution.p12"

          echo "$MACOS_INSTALLER_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/installer.p12" -P "$MACOS_INSTALLER_P12_PASSWORD" -f pkcs12 -A -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/installer.p12"

          # Lets codesign and productbuild use the keys without a password prompt, and puts the keychain in the search list.
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -oE '"(Apple|iPhone) Distribution[^"]*"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "No Apple Distribution signing identity found in IOS_P12_BASE64"
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi

          INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN" | grep -oE '"(3rd Party Mac Developer Installer|Mac Installer Distribution)[^"]*"' | head -1 | tr -d '"')
          if [ -z "$INSTALLER_IDENTITY" ]; then
            echo "No Mac Installer Distribution identity found in MACOS_INSTALLER_P12_BASE64"
            security find-identity -v "$KEYCHAIN"
            exit 1
          fi

          PROFILE="$RUNNER_TEMP/profile.provisionprofile"
          echo "$MACOS_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")

          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE" "$dir/$PROFILE_UUID.provisionprofile"
          done

          echo "Signing identity: $IDENTITY"
          echo "Installer identity: $INSTALLER_IDENTITY"
          echo "Provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "installer_identity=$INSTALLER_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"

      # =========================
      # BUILD PKG
      # =========================

      # Release builds both Intel and Apple silicon (maccatalyst-x64;maccatalyst-arm64), which the Mac App Store
      # requires. Platforms/MacCatalyst/Entitlements.plist turns on the App Sandbox the store also requires.
      - name: Publish macOS PKG
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}" \
            -c Release \
            -f net10.0-maccatalyst \
            -p:CreatePackage=true \
            -p:EnableCodeSigning=true \
            -p:EnablePackageSigning=true \
            "-p:CodesignKey=${{ steps.signing.outputs.identity }}" \
            "-p:CodesignProvision=${{ steps.signing.outputs.profile }}" \
            -p:CodesignEntitlements=Platforms/MacCatalyst/Entitlements.plist \
            "-p:PackageSigningKey=${{ steps.signing.outputs.installer_identity }}" \
            "-p:ApiBaseUrl=${{ vars.API_BASE_URL }}"

      # =========================
      # FIND PKG
      # =========================

      - name: Find PKG
        id: find_pkg
        run: |
          FILE=$(find . -name "*.pkg" -path "*Release*" | head -1)

          if [ -z "$FILE" ]; then
            echo "No PKG found"
            find . -name "*.pkg"
            exit 1
          fi

          echo "PKG: $FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      # =========================
      # UPLOAD ARTIFACT
      # =========================

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: ${{ steps.find_pkg.outputs.file }}

      # =============================
      # APP STORE CONNECT UPLOAD
      # =============================

      # The same App Store Connect API key as the iOS upload. The build shows up under the app's macOS TestFlight
      # once Apple has processed it; submitting it for Mac App Store review stays manual.
      - name: Upload PKG to App Store Connect
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          for name in APPSTORE_KEY_ID APPSTORE_ISSUER_ID APPSTORE_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "$name secret is not set"
              exit 1
            fi
          done

          # altool looks for the key as ~/private_keys/AuthKey_<key id>.p8.
          mkdir -p "$HOME/private_keys"
          echo "$APPSTORE_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_$APPSTORE_KEY_ID.p8"

          xcrun altool --upload-app \
            --type macos \
            --file "${{ steps.find_pkg.outputs.file }}" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${{ steps.signing.outputs.keychain }}" ]; then
            security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
          fi
          rm -rf "$HOME/private_keys"

  # ==================================================
  # RELEASE
  # ==================================================

  release:
    needs: [version, build-android, build-windows, build-ios, build-macos]
    # Runs once every selected platform succeeded - an unselected one is skipped, not failed.
    if: ${{ !cancelled() && needs.version.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest

    steps:
      - name: Download AAB
        if: ${{ inputs.publish_android }}
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: dist

      - name: Download APK
        if: ${{ inputs.publish_android }}
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.new_version }}
          name: Release v${{ needs.version.outputs.new_version }}
          generate_release_notes: true
          files: |
            dist/**/*.aab
            dist/**/*.apk
